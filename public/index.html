<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="only light" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#123f78" />
    <title>Inscripción Pádel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <!-- líneas de la cancha vista desde arriba -->
      <svg class="cancha" viewBox="0 0 200 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="2">
          <rect x="20" y="20" width="160" height="360" />
          <line x1="20" y1="200" x2="180" y2="200" stroke-width="3" stroke-dasharray="4 3" />
          <line x1="20" y1="89" x2="180" y2="89" />
          <line x1="20" y1="311" x2="180" y2="311" />
          <line x1="100" y1="89" x2="100" y2="311" />
        </g>
      </svg>

      <div class="hero-in">
        <div class="hero-texto">
          <span class="tag">Inscripción abierta</span>
          <h1 id="titulo"></h1>
          <p id="bajada"></p>
        </div>

        <svg class="paleta" viewBox="0 0 200 360" aria-hidden="true">
          <defs>
            <!-- tejido de carbono -->
            <pattern id="carbono" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
              <rect width="6" height="6" fill="#161616" />
              <rect width="3" height="3" fill="#232323" />
              <rect x="3" y="3" width="3" height="3" fill="#232323" />
            </pattern>
            <pattern id="grip" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-20)">
              <rect width="9" height="9" fill="#111" />
              <circle cx="2.5" cy="2.5" r="1.3" fill="#e0263f" />
              <circle cx="7" cy="7" r="1" fill="#e0263f" fill-opacity=".7" />
            </pattern>
            <linearGradient id="brillo" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fff" stop-opacity=".16" />
              <stop offset=".45" stop-color="#fff" stop-opacity="0" />
            </linearGradient>
          </defs>
          <!-- marco en diamante + brazos del puente -->
          <path
            d="M100 6c56 0 90 14 93 56 2 34-13 70-35 100-16 22-32 36-42 58l-3 38H87l-3-38c-10-22-26-36-42-58C20 132 5 96 7 62 10 20 44 6 100 6Z"
            fill="#0e0e0e" stroke="#3b3b3b" stroke-width="1.5"
          />
          <!-- cara de carbono -->
          <path
            d="M100 15c52 0 80 12 83 48 2 30-11 62-31 88-15 20-32 34-52 40-20-6-37-20-52-40-20-26-33-58-31-88 3-36 31-48 83-48Z"
            fill="url(#carbono)"
          />
          <g fill="#f5f5f5"><circle cx="54" cy="38" r="5.8"/><circle cx="77" cy="38" r="5.8"/><circle cx="100" cy="38" r="5.8"/><circle cx="123" cy="38" r="5.8"/><circle cx="146" cy="38" r="5.8"/><circle cx="42.5" cy="57.5" r="5.8"/><circle cx="65.5" cy="57.5" r="5.8"/><circle cx="88.5" cy="57.5" r="5.8"/><circle cx="111.5" cy="57.5" r="5.8"/><circle cx="134.5" cy="57.5" r="5.8"/><circle cx="157.5" cy="57.5" r="5.8"/><circle cx="31" cy="77" r="5.8"/><circle cx="54" cy="77" r="5.8"/><circle cx="77" cy="77" r="5.8"/><circle cx="100" cy="77" r="5.8"/><circle cx="123" cy="77" r="5.8"/><circle cx="146" cy="77" r="5.8"/><circle cx="169" cy="77" r="5.8"/><circle cx="42.5" cy="96.5" r="5.8"/><circle cx="65.5" cy="96.5" r="5.8"/><circle cx="88.5" cy="96.5" r="5.8"/><circle cx="111.5" cy="96.5" r="5.8"/><circle cx="134.5" cy="96.5" r="5.8"/><circle cx="157.5" cy="96.5" r="5.8"/><circle cx="54" cy="116" r="5.8"/><circle cx="77" cy="116" r="5.8"/><circle cx="100" cy="116" r="5.8"/><circle cx="123" cy="116" r="5.8"/><circle cx="146" cy="116" r="5.8"/><circle cx="65.5" cy="135.5" r="5.8"/><circle cx="88.5" cy="135.5" r="5.8"/><circle cx="111.5" cy="135.5" r="5.8"/><circle cx="134.5" cy="135.5" r="5.8"/><circle cx="100" cy="155" r="5.8"/></g>
          <!-- detalles rojos a los costados y arriba -->
          <path d="M33 126h17M150 126h17" stroke="#e0263f" stroke-width="2.4" stroke-linecap="round" />
          <circle cx="100" cy="24" r="3" fill="#e0263f" />
          <path d="M84 172h32" stroke="#6b6b6b" stroke-width="2" stroke-linecap="round" />
          <circle cx="90" cy="180" r="1.8" fill="#e0263f" /><circle cx="97" cy="180" r="1.8" fill="#e0263f" />
          <circle cx="104" cy="180" r="1.8" fill="#e0263f" /><circle cx="111" cy="180" r="1.8" fill="#e0263f" />
          <!-- reflejo -->
          <path
            d="M100 15c52 0 80 12 83 48 2 30-11 62-31 88-15 20-32 34-52 40-20-6-37-20-52-40-20-26-33-58-31-88 3-36 31-48 83-48Z"
            fill="url(#brillo)"
          />
          <!-- hueco en V del puente -->
          <path class="hueco" d="M85 205q15 6 30 0l-11 27q-4 5-8 0Z" />
          <!-- mango -->
          <rect x="86" y="256" width="28" height="84" rx="5" fill="url(#grip)" />
          <rect x="84" y="336" width="32" height="12" rx="4" fill="#0a0a0a" stroke="#3b3b3b" />
          <!-- correa -->
          <path d="M92 348c-8 8-26 10-40 6" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round" />
        </svg>

        <svg class="pelota" viewBox="-25 -25 50 50" aria-hidden="true">
          <circle r="23" fill="#d8f03c" />
          <path d="M-17-15c9 8 9 22 0 30M17-15c-9 8-9 22 0 30" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" />
        </svg>
      </div>
      <div class="red" aria-hidden="true"></div>
    </header>

    <main id="app" aria-live="polite">
      <div class="cargando"><span class="bote"></span>Cargando horarios…</div>
    </main>

    <div id="toast" role="alert" hidden></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
